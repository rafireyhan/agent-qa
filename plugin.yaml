name: qa-agent
version: 1.5.0
description: >
  End-to-end QA workflow with specialized agents: PRD analysis, test
  documentation, manual testing, smoke testing from UAT scripts, retest,
  Playwright automation, and exploratory testing. Each agent runs
  step-by-step while completing authorized local work. Run /qa-agent for the full cycle
  or individual agents for a specific phase.
author: mcahya20
provides_commands:
  - qa-agent
  - qa-agent-app-discovery
  - qa-agent-prd
  - qa-agent-documentation
  - qa-agent-manual-testing
  - qa-smoke-test
  - qa-agent-retest
  - qa-agent-automation
  - qa-exploratory-testing
  - exploratory-testing
  - humanizer
provides_skills:
  - qa-agent
  - qa-agent-app-discovery
  - qa-agent-prd
  - qa-agent-documentation
  - qa-agent-manual-testing
  - qa-smoke-test
  - qa-agent-retest
  - qa-agent-automation
  - qa-exploratory-testing
  - exploratory-testing
